version: "3.9"

services:
  aegis-keycloak-db:
    image: postgres:16
    container_name: aegis-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloakpass
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - aegis-net

  aegis-keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: aegis-keycloak
    restart: unless-stopped
    depends_on:
      - aegis-keycloak-db
    command:
      - start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://aegis-keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloakpass
      KC_PROXY: edge
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "8080:8080"
    networks:
      - aegis-net

volumes:
  keycloak-db-data:

networks:
  aegis-net:
    driver: bridge
